name: CI

on:
  push:
    branches: [main, master, 'test/**']
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Syntax check extracted modules
        run: |
          for f in app/utils/*.js app/ui/*.js app/auth/*.js app/order/*.js app/report/*.js; do
            node --check "$f" || exit 1
          done
          echo "All modules syntax OK"

      - name: Run tests
        run: npm test -- --runInBand

      - name: Run ESLint
        run: npx eslint app.js app/utils/ app/ui/ app/auth/ app/order/ app/report/ --no-error-on-unmatched-pattern
